<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reindirizzamento - Contatti IT-ERA</title>
    <meta http-equiv="refresh" content="0; url=/contatti.html">
    <link rel="canonical" href="https://it-era.it/contatti.html">
    <script>
        // Redirect immediato
        window.location.replace('/contatti.html');
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .redirect-box {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #fff;
            text-decoration: underline;
        }
        a:hover {
            color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <h1>🔄 Reindirizzamento in corso...</h1>
        <div class="spinner"></div>
        <p>Ti stiamo portando alla pagina contatti di IT-ERA</p>
        <p><a href="/contatti.html">Clicca qui se non vieni reindirizzato automaticamente</a></p>
        <hr style="margin: 20px 0; border: 1px solid rgba(255,255,255,0.3);">
        <p><strong>📞 Emergenza IT: 039 888 2041</strong></p>
        <p><strong>📧 Email: info@bulltech.it</strong></p>
    </div>

    <script>
        // Countdown per UX migliore
        let countdown = 3;
        const countdownElement = document.createElement('p');
        countdownElement.style.fontSize = '18px';
        countdownElement.style.fontWeight = 'bold';
        document.querySelector('.redirect-box').appendChild(countdownElement);
        
        const updateCountdown = () => {
            if (countdown > 0) {
                countdownElement.textContent = `Redirect automatico in ${countdown} secondi...`;
                countdown--;
                setTimeout(updateCountdown, 1000);
            } else {
                countdownElement.textContent = 'Reindirizzamento...';
                window.location.replace('/contatti.html');
            }
        };
        
        updateCountdown();
        
        // Fallback immediato se l'utente clicca
        document.addEventListener('click', function() {
            window.location.replace('/contatti.html');
        });
    </script>
</body>
</html>
